[package]
name = "bb1"
version = "0.1.0"
edition = "2024"
description = "bb1 for Windows and Linux"
license = "GPL-3.0-or-later"
default-run = "bb1"

[dependencies]
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
crossbeam-channel = "0.5.17"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
mdns-sd = "0.21.6"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = { version = "0.6.5", features = ["all"] }
x25519-dalek = { version = "3.0.0", features = ["static_secrets"] }

[target."cfg(windows)".dependencies]
# For #[implement] (COM objects Windows calls back: the sound capture's activation handler).
windows-core = "0.62.2"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Imaging",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct2D",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_Media_Audio",
  "Win32_System_Threading",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Controls",
  "Win32_Graphics_Dwm",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_Security",
  "Win32_System_SystemServices",
  "Win32_Media",
  "Win32_System_Performance",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_Devices_Display",
] }
windows-numerics = "0.3.1"
vigem-client = { version = "0.1.4", features = ["unstable_xtarget_notification"] }

[target."cfg(target_os = \"linux\")".dependencies]
# Linux app (src/linux): SDL3 stream window, FFmpeg's libavcodec (decode; host encode through NVENC
# or x264), PipeWire (screen and sound capture), the desktop portal over D-Bus (screen-share and
# remote-input permission), egui for the main window.
sdl3-sys = "0.7.3"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }
pipewire = "0.10.1"
zbus = "4.4.0"
wry = "0.57.1"
tao = "0.37.2"
# Same GTK as tao, to paint the window's title bar in bb1's background colour.
gtk = "0.18.2"

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "unwind"
